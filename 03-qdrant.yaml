# Qdrant dédié à l'API RAG ONE ID, déployé DANS le cluster (base vectorielle).
# Choix : StatefulSet 1 replica (identité stable + volume persistant par pod) plutôt
# que d'exposer le Qdrant de djinn-bot (cf docs/DECISIONS.md).
# Version EXACTE v1.12.4 : compat testée avec qdrant-client==1.12.2 côté appli.
# Exposition INTERNE uniquement (ClusterIP) — pas d'HTTPRoute, pas d'accès externe.
# Ports : 6333 (HTTP/REST) et 6334 (gRPC). L'appli parle en HTTP sur 6333.
#
# CAUSE RACINE (diagnostiquée par l'infra, résolue le 10/09) : la config par défaut
# de l'image qdrant/qdrant utilise des chemins RELATIFS résolus depuis le CWD /qdrant :
#   storage_path:   ./storage    -> /qdrant/storage   (monté sur le PVC : OK)
#   snapshots_path: ./snapshots  -> /qdrant/snapshots  (couche image, NON monté, KO)
# Le dossier /qdrant appartient à root:root 755 dans l'image ; en non-root (uid 1000,
# requis par la policy PodSecurity du cluster), Qdrant ne peut pas créer ce répertoire
# au démarrage -> panic immédiat "Can't create Snapshots directory: Permission denied".
# Le PVC/Ceph RBD n'est PAS en cause (vérifié par test d'écriture indépendant côté infra).
# CORRECTIF : forcer le chemin des snapshots vers un sous-dossier du PVC monté, via
# la variable d'env QDRANT__STORAGE__SNAPSHOTS_PATH (voir env: ci-dessous).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: numa
  labels:
    app: qdrant
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # Prépare uniquement le sous-répertoire snapshots s'il n'existe pas encore.
        # NE JAMAIS supprimer de données ici : ce container s'exécute à CHAQUE
        # démarrage de pod (crash, redémarrage, migration de nœud...) — un rm -rf
        # ici effacerait collections/raft_state à chaque redémarrage (incident du
        # 10/09, cf docs/BLOCAGES.md). Idempotent par construction (mkdir -p).
        - name: init-storage
          image: qdrant/qdrant:v1.12.4
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          command:
            - sh
            - -c
            - |
              mkdir -p /qdrant/storage/snapshots
              echo "Storage snapshots dir ready (non-destructif)."
              ls -la /qdrant/storage/
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          imagePullPolicy: IfNotPresent
          env:
            # Redirige le chemin des snapshots (relatif par défaut : ./snapshots,
            # résolu hors du PVC) vers un chemin absolu SUR le volume persistant.
            # Sans ça, Qdrant tente d'écrire sur la couche image (root:root, non
            # accessible en uid 1000) et panique au démarrage.
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/storage/snapshots
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 6333
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: numa
  labels:
    app: qdrant
spec:
  # ClusterIP par défaut : accessible uniquement en intra-cluster (http://qdrant:6333).
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
