# Secret contenant les clés/API et secrets de l'API RAG ONE ID.
# NE PAS committer ce fichier avec les vraies valeurs. Préférer la création/mise
# à jour en ligne de commande :
#   kubectl -n numa create secret generic rag-id-secrets \
#     --from-literal=LLM_API_KEY='«redacted:sk-…»' \
#     --from-literal=AZURE_CLIENT_ID='«redacted»' \
#     --from-literal=AZURE_CLIENT_SECRET='«redacted»' \
#     --from-literal=AZURE_TENANT_ID='«redacted»' \
#     --from-literal=SESSION_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
#
# Pour ajouter/mettre à jour une clé sans écraser les autres (merge patch) :
#   kubectl -n numa patch secret rag-id-secrets --type merge \
#     -p '{"stringData":{"LLM_API_KEY":"«redacted»"}}'
#
# SESSION_SECRET_KEY doit rester STABLE entre redémarrages (sinon toutes les
# sessions cookie signées sont invalidées) et DISTINCTE de la valeur preprod.
#
# Le YAML ci-dessous est fourni pour référence (valeurs à remplacer — ne jamais
# committer les vraies). Il sert uniquement à documenter la forme du Secret.
apiVersion: v1
kind: Secret
metadata:
  name: rag-id-secrets
  namespace: numa
type: Opaque
stringData:
  LLM_API_KEY: ""            # clé API instance LLM interne ONE ID (llm.one-id.fr)
  AZURE_CLIENT_ID: ""        # app registration Azure AD (auth O365)
  AZURE_CLIENT_SECRET: ""    # secret client Azure AD
  AZURE_TENANT_ID: ""        # tenant Azure AD
  SESSION_SECRET_KEY: ""     # clé de signature des cookies de session (itsdangerous)
