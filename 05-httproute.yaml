# Exposition de l'API RAG via le Gateway lan-id (Envoy Gateway), IP 10.13.1.106.
# ragid.one-id.fr est un CNAME vers lan-id.one-id.fr (point d'entrée réseau
# physique commun) — c'est ce Gateway (namespace gw-id) qui route par Host header
# vers le bon backend, PAS gw01 (10.13.1.104, découvert incorrect lors du premier
# déploiement, cf docs/BLOCAGES.md du 10/09 : 404 malgré route "Accepted").
# Le Gateway autorise les routes de tous les namespaces (allowedRoutes: From All),
# donc l'HTTPRoute vit dans le namespace applicatif "numa" (même schéma que ao-id).
# TLS : assuré par le listener https de lan-id (cert wildcard *.one-id.fr).
# DNS : ragid.one-id.fr -> CNAME lan-id.one-id.fr -> 10.13.1.106 (fait par l'infra).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rag-id
  namespace: numa
spec:
  parentRefs:
    - name: lan-id
      namespace: gw-id
  hostnames:
    - "ragid.one-id.fr"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rag-id
          port: 80
