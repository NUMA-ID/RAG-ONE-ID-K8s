apiVersion: v1
kind: Pod
metadata:
  name: qdrant-fix-perms
  namespace: numa
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: false
    runAsUser: 0  # root pour changer les permissions
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: storage-qdrant-0
  containers:
    - name: fix
      image: qdrant/qdrant:v1.12.4
      command:
        - sh
        - -c
        - |
          echo "Fixing Qdrant storage permissions..."
          mkdir -p /qdrant/storage/snapshots /qdrant/storage/collections /qdrant/storage/raft_state
          chown -R 1000:1000 /qdrant/storage
          chmod 755 /qdrant/storage
          echo "Done."
          ls -la /qdrant/storage/
      volumeMounts:
        - name: storage
          mountPath: /qdrant/storage
